# Synchronisation automatique de ma collection Discogs, chaque semaine (dimanche).
# GitHub lance scripts/sync.py sur une de ses machines, puis enregistre
# data/collection.json (et data/musicbrainz.json) dans le dépôt : GitHub Pages republie alors le site.

name: Synchro Discogs et MusicBrainz

on:
  schedule:
    - cron: "30 2 * * 0"   # le dimanche (0) à 2 h 30 UTC (3 h 30 à Paris en hiver, 4 h 30 en été)
  workflow_dispatch:        # bouton « Run workflow » pour la lancer à la main
    inputs:
      relire:
        description: "Éditions à relire tout de suite (n° Discogs, séparés par des virgules). Laisser vide pour une synchro normale."
        required: false
        type: string

# Le robot a le droit d'écrire dans le dépôt (pour enregistrer la collection).
permissions:
  contents: write

# Jamais deux synchros en même temps.
concurrency:
  group: synchro

jobs:
  synchro:
    runs-on: ubuntu-latest
    timeout-minutes: 60    # la première recherche MusicBrainz prend une vingtaine de minutes
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Lancer la synchro
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}   # le secret, jamais écrit en clair
          RELIRE: ${{ inputs.relire }}                  # vide pour la synchro du dimanche
        run: |
          # Avec des n° d'éditions : ces éditions sont relues sur Discogs et MusicBrainz en plus de la synchro habituelle.
          if [ -n "$RELIRE" ]; then
            python3 scripts/sync.py --relire "$RELIRE"
          else
            python3 scripts/sync.py
          fi

      - name: Enregistrer le résultat s'il a changé
        run: |
          git add data/
          # Pas de nouvel enregistrement si seule la date de synchro a changé.
          if git diff --cached --quiet -I '"genere_le"'; then
            echo "Rien de nouveau dans la collection."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Synchro Discogs du $(date -u +%Y-%m-%d)"
          git push
